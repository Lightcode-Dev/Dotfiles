# Images -> gwenview (GUI app, runs outside the terminal)
protocol file
mime image/*
action launch --type=background gwenview -- $FILE_PATH

# Directories -> ranger in a new kitty OS window
protocol file
mime inode/directory
action launch --type=os-window --cwd=current ranger -- $FILE_PATH

# Text files -> vim, as an overlay over the current window
protocol file
mime text/*
action launch --type=overlay vim -- $FILE_PATH

# file:line links (e.g. from grep-style tools) -> vim at that line
protocol file
fragment_matches [0-9]+
action launch --type=overlay vim +${FRAGMENT} -- $FILE_PATH

# Video files -> vlc (GUI app, runs outside the terminal)
protocol file
mime video/*
action launch --type=background vlc -- $FILE_PATH
