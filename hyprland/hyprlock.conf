# Colors generated by wallust ($background, $foreground, $color12, ...)
source = $HOME/.config/hypr/hyprlock-colors.conf

general {
    hide_cursor = true
    ignore_empty_input = true     # Enter on an empty box does nothing
}

background {
    monitor =
    path = $HOME/.cache/wallpaper-current
    color = $background           # shown until the image has loaded
    blur_passes = 2
    blur_size = 4
    brightness = 0.7
}

# Clock
label {
    monitor =
    text = $TIME
    color = $foreground
    font_size = 110
    font_family = Terminess Nerd Font
    position = 0, 160
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d %B"
    color = $color13
    font_size = 24
    font_family = Terminess Nerd Font
    position = 0, 70
    halign = center
    valign = center
}

# Username
label {
    monitor =
    text = $USER
    color = $color12
    font_size = 20
    font_family = Terminess Nerd Font
    position = 0, 10
    halign = center
    valign = center
}

# Password box
input-field {
    monitor =
    size = 300, 56
    outline_thickness = 3
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    outer_color = $color12
    inner_color = $background_a
    font_color = $foreground
    check_color = $color13
    fail_color = $color9
    fade_on_empty = false
    rounding = 14
    placeholder_text = <i>Password</i>
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    position = 0, -60
    halign = center
    valign = center
}
