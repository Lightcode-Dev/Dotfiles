# ── Base quality profile ──
# Bundles a set of sane high-quality defaults (better scalers, etc.)
# as a starting point before we override anything below.
profile=gpu-hq

# ── Scaling algorithms (used for anything NOT handled by Anime4K) ──
# ewa_lanczossharp: high-quality luma/chroma scaler with sharpening baked in
scale=ewa_lanczossharp
cscale=ewa_lanczossharp
# mitchell: smooth downscaling filter, avoids ringing when shrinking video
dscale=mitchell
# oversample: keeps motion looking correct when the video's frame rate
# doesn't match your display's refresh rate (avoids judder)
tscale=oversample

# Corrects for a downscaling colorspace quirk so colors don't shift
# when the video is scaled down instead of up
correct-downscaling=yes

# Do upscaling math in sigmoid space instead of linear — reduces
# ringing/haloing around sharp edges when scaling up
sigmoid-upscaling=yes

# Prevents mpv's built-in scalers from firing when the video is
# already at the correct size — avoids wasted GPU work
scaler-resizes-only=yes

# Applies subtle dithering to gradients to prevent visible color banding
deband=yes

# ── Anime4K shader chain (the actual upscaling) ──
# Each line appends one shader, applied in the order listed below.
# Restore_CNN_M cleans up compression artifacts/ringing in the source,
# then Upscale_CNN_x2_M does the actual 2x AI upscale.
# "M" = medium network size (balance of quality vs GPU load — see notes below)
glsl-shaders-append="~~/shaders/Anime4K_Restore_CNN_M.glsl"
glsl-shaders-append="~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl"
