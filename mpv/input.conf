# ── Anime4K quality presets ──
# change-list glsl-shaders set REPLACES the whole shader chain at once
CTRL+1 change-list glsl-shaders set "~~/shaders/Anime4K_Restore_CNN_S.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_S.glsl"; show-text "Anime4K: Fast (S)"
CTRL+2 change-list glsl-shaders set "~~/shaders/Anime4K_Restore_CNN_M.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl"; show-text "Anime4K: Medium (M)"
CTRL+3 change-list glsl-shaders set "~~/shaders/Anime4K_Restore_CNN_L.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_L.glsl"; show-text "Anime4K: High (L)"
CTRL+4 change-list glsl-shaders set "~~/shaders/Anime4K_Restore_CNN_VL.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_VL.glsl"; show-text "Anime4K: Very High (VL)"

# Clears all shaders — useful for A/B comparing against the raw source
CTRL+0 change-list glsl-shaders clr ""; show-text "Anime4K: Off"
